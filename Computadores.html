:root[data-theme="dark"]{--bg:#171613;--card:#211f1b;--ink:#ece6d9;--mut:#9d9586;--line:#37332b;--acc:#e07a4f;--ok:#8fcf98;--okbg:#22321f;--bad:#f09a8f;--badbg:#3a1f1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif}
header{max-width:1000px;margin:0 auto;padding:36px 20px 18px;border-bottom:2px solid var(--ink)}
header small{color:var(--acc);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:12px}

.top button{font:inherit;background:none;border:1px solid var(--line);color:var(--ink);padding:4px 12px;border-radius:4px;cursor:pointer}

nav{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:2px}
nav button{text-align:left;font:inherit;background:none;border:0;border-left:3px solid var(--line);padding:9px 12px;color:var(--mut);cursor:pointer;line-height:1.3}
nav button b{display:block;color:var(--ink);font-weight:500}
nav button.on{border-color:var(--acc);background:var(--card)}

.fb{font-size:14px;margin-top:6px;font-weight:500}
.ans{display:none;margin-top:12px;padding:12px 14px;border-left:3px solid var(--acc);white-space:pre-line;font-size:15px}

.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}.sm div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}.sm strong{display:block;font:700 28px Fraunces,Georgia,serif;color:var(--acc)}.sm span{font-size:13px;color:var(--mut)}.tb{width:100%;border-collapse:collapse;margin-bottom:24px;font-size:14px}.tb th,.tb td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}.er{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:4px;padding:12px 14px;margin-bottom:10px;font-size:14px}.er p{margin:4px 0}.er .m{color:var(--bad)}.er .c{color:var(--ok)}.rev{font:inherit;background:none;border:0;color:var(--acc);cursor:pointer;padding:0;text-decoration:underline}
@media(max-width:720px){main{grid-template-columns:1fr;gap:16px}nav{position:static;flex-direction:row;overflow-x:auto}nav button{border-left:0;border-bottom:3px solid var(--line);min-width:110px}nav button.on{border-color:var(--acc)}nav button span{display:none}}

const L=["A","B","C","D","E"];
const D=[
{t:"Introdução às Redes",s:"Histórico, evolução, LAN/MAN/WAN e topologias",
o:[
["O que é uma rede de computadores?",["Conjunto de dispositivos interligados que transmitem e compartilham informações e recursos","Um único computador que processa grandes volumes de dados","Um sistema operacional que gerencia arquivos em disco","Um protocolo exclusivo para satélite","Um software de segurança contra vírus"],0],
["Em que ano surgiu a ARPANET, precursora da internet?",["1946","1958","1969","1983","1991"],2],
["Qual marco da década de 1980 foi fundamental para a internet?",["Telégrafo elétrico de Morse","TCP/IP como padrão obrigatório na ARPANET e popularização da internet","ALOHAnet, primeira rede sem fio","Código binário de Leibniz","ENIAC"],1],
["O que é necessário para dois dispositivos se comunicarem em rede?",["Apenas um dispositivo com internet","Origem, destino e um meio de comunicação com protocolo comum","Somente fibra óptica de alta velocidade","Um servidor central para todas as mensagens","Windows instalado em todos os dispositivos"],1],
["Qual filósofo criou o sistema binário (0 e 1)?",["Francis Bacon","Samuel Morse","Robert Metcalfe","Gottfried Leibniz","Vinton Cerf"],3]],
d:[
["Descreva a evolução histórica das redes, do telégrafo à internet moderna, destacando os principais marcos.","Tudo começa com o telégrafo elétrico de Morse (séc. XIX), a primeira comunicação a distância por sinais elétricos, e com o sistema binário de Leibniz, base da computação. Em 1946 surge o ENIAC.\n\nEm 1969 nasce a ARPANET, com comutação de pacotes. Nos anos 1970, a ALOHAnet mostra a viabilidade da rede sem fio e Metcalfe cria a Ethernet. Em 1983 o TCP/IP se torna padrão obrigatório na ARPANET, permitindo interligar redes diferentes.\n\nNos anos 1990, a World Wide Web populariza a internet, que evolui para banda larga, Wi-Fi e redes móveis 4G/5G."],
["Explique o conceito de rede de computadores e sua importância. Cite três aplicações práticas.","Rede de computadores é um conjunto de dispositivos interligados por meios físicos ou sem fio que trocam dados e compartilham recursos usando protocolos comuns.\n\n• E-mail e videoconferência: permitem trabalho remoto e comunicação instantânea.\n• Internet banking e pagamentos (Pix, cartões): dependem de redes seguras e disponíveis.\n• Compartilhamento de impressoras, arquivos e nuvem: reduz custos e centraliza dados nas organizações.\n\nSem redes, empresas, escolas e serviços públicos perderiam agilidade e integração."]]},
{t:"Classificações e Topologias",s:"LAN, MAN, WAN e topologias físicas",
o:[
["O que diferencia uma LAN de uma WAN?",["LAN usa só fibra, WAN usa par trançado","LAN abrange área menor (prédio, campus); WAN interliga localidades distantes, como cidades ou países","LAN é sempre mais rápida que WAN","WAN é doméstica e LAN é de grandes empresas","Não há diferença significativa"],1],
["Qual a principal característica da topologia em estrela?",["Dispositivos conectados formando um anel fechado","Todos compartilham um único cabo","Todos se conectam a um ponto central (switch ou hub), facilitando gerência e isolamento de falhas","Não precisa de equipamentos intermediários","Dados trafegam em uma só direção, sem colisões"],2],
["Qual rede é mais adequada para interligar duas filiais em cidades diferentes?",["LAN","PAN","MAN ou WAN","SAN","VLAN"],2],
["Qual a principal desvantagem da topologia em barramento (bus)?",["Exige equipamento central caro","Falha no cabo principal pode derrubar toda a rede, pois o meio é compartilhado","Não permite mais de cinco dispositivos","É incompatível com protocolos modernos","Gera ruído que impede a comunicação em áreas urbanas"],1],
["O TCP/IP tornou-se padrão obrigatório na ARPANET em que ano?",["1969","1975","1983","1991","1995"],2]],
d:[
["Compare LAN, MAN e WAN em abrangência, velocidade, custo e exemplos de aplicação.","LAN: abrange prédio ou campus; alta velocidade e baixo custo. Ex.: rede de um escritório ou laboratório.\n\nMAN: abrange uma cidade ou região metropolitana; velocidade alta e custo intermediário. Ex.: prefeitura ligando secretarias e escolas por fibra.\n\nWAN: abrange cidades, países ou continentes; velocidade e latência dependem dos enlaces contratados e o custo é maior. Ex.: banco conectando agências em vários estados, a própria internet.\n\nUse LAN dentro do local, MAN para interligar unidades na mesma cidade e WAN para unidades distantes."],
["Explique as diferenças entre as topologias físicas estrela, barramento, anel e malha.","Estrela: tudo ligado a um switch central. Vantagens: fácil gerência e falha isolada. Desvantagem: o ponto central é crítico. Ideal para redes locais em geral.\n\nBarramento: um cabo compartilhado. Barato e simples, mas uma falha no cabo derruba a rede e o desempenho cai com mais equipamentos. Hoje quase obsoleta.\n\nAnel: cada nó liga ao vizinho e os dados circulam em um sentido. Acesso ordenado ao meio, mas a quebra do anel afeta a rede. Usada em backbones com fibra.\n\nMalha: nós com múltiplas conexões. Alta redundância e confiabilidade, porém custo e complexidade elevados. Indicada para ambientes críticos e para a própria internet."]]},
{t:"Modelos de Referência e Equipamentos",s:"OSI, TCP/IP, hubs, switches, roteadores e APs",
o:[
["Quantas camadas tem o Modelo OSI e quem o normatizou?",["4 camadas, IEEE","5 camadas, IETF","7 camadas, ISO","7 camadas, ANSI","4 camadas, ISO"],2],
["Qual camada OSI é responsável pelo roteamento entre redes diferentes?",["1 – Física","2 – Enlace","3 – Rede","4 – Transporte","7 – Aplicação"],2],
["Qual a principal diferença entre HUB e SWITCH?",["O HUB trabalha na camada 3 e o Switch na camada 1","O HUB encaminha só à porta de destino por MAC e o Switch envia a todas","O HUB retransmite a todas as portas; o Switch comuta quadros pelo endereço MAC, reduzindo colisões","O Switch é antigo e foi substituído pelo HUB","Não há diferença funcional"],2],
["No TCP/IP, qual camada equivale a Aplicação, Apresentação e Sessão do OSI?",["Acesso à Rede","Internet","Transporte","Aplicação","Enlace"],3],
["Qual protocolo de Transporte garante entrega confiável, com controle de fluxo e erro?",["IP","HTTP","UDP","TCP","ICMP"],3]],
d:[
["Descreva o encapsulamento de dados no Modelo OSI, usando como exemplo o acesso a um site.","Os dados descem as camadas no emissor, cada uma acrescentando um cabeçalho, e sobem no receptor, onde cada camada remove o seu.\n\n7-5 Aplicação/Apresentação/Sessão: o navegador gera a requisição HTTP(S), com formatação e criptografia.\n4 Transporte: o TCP divide em segmentos e adiciona portas (ex.: 443).\n3 Rede: o IP cria pacotes com endereços de origem e destino.\n2 Enlace: forma quadros com endereços MAC e verificação de erros.\n1 Física: converte os quadros em bits (sinais elétricos, luz ou ondas).\n\nNo servidor o caminho é inverso, até a aplicação web receber a requisição."],
["Compare OSI e TCP/IP. Por que o TCP/IP é o usado na internet e o OSI é referência didática?","O OSI tem 7 camadas (Física, Enlace, Rede, Transporte, Sessão, Apresentação, Aplicação); o TCP/IP tem 4 (Acesso à Rede, Internet, Transporte, Aplicação). Ambos são em camadas e têm Rede/Internet e Transporte equivalentes. No TCP/IP, Aplicação reúne as três camadas superiores do OSI e Acesso à Rede reúne Física e Enlace.\n\nO TCP/IP nasceu da prática, na ARPANET, foi adotado como padrão em 1983 e já tinha protocolos funcionando. O OSI, criado pela ISO, veio depois e era mais complexo, por isso ficou como modelo conceitual para ensinar e localizar problemas."]]},
{t:"Camada Física e Datacenter",s:"Cabeamento, fibra, NBR 14565 e Tiers",
o:[
["Qual a principal vantagem da fibra óptica sobre o par trançado?",["É mais barata e fácil de instalar","Transmite por luz, com maior velocidade, maior distância e menor atenuação","O par trançado suporta mais velocidade em longas distâncias","É mais suscetível a interferência eletromagnética","Têm desempenho equivalente"],1],
["Qual norma brasileira regulamenta o cabeamento estruturado?",["ANSI/TIA-568","ISO/IEC 11801","ABNT NBR 14565","IEEE 802.3","ITU-T G.652"],2],
["O que caracteriza um datacenter Tier III?",["Sem redundância; manutenção com parada total","Redundância completa (2N), 99,9999% de disponibilidade","Redundância parcial, convertível em Tier IV, com manutenção simultânea sem interrupção","Uso exclusivamente residencial","99,671% com uma única via ativa"],2],
["Qual conector é padrão em cabos de par trançado Ethernet?",["RJ-11","RJ-45","BNC","SC","LC"],1],
["O que significa UTP?",["Universal Transfer Protocol","Unshielded Twisted Pair (par trançado não blindado)","Ultra Transmission Power","Unified Trunk Port","Unidirectional Transfer Path"],1]],
d:[
["Explique o cabeamento estruturado, seus componentes, a norma NBR 14565 e o impacto na escalabilidade e manutenção.","Cabeamento estruturado é uma infraestrutura padronizada, independente de aplicação, que atende voz, dados e imagem.\n\nComponentes: cabeamento horizontal (do painel de distribuição às tomadas de trabalho), cabeamento vertical ou backbone (entre andares e salas de equipamentos), patch panels (pontos de conexão e manobra) e racks (organizam equipamentos).\n\nA NBR 14565 padroniza projeto, instalação e testes no Brasil, garantindo qualidade e compatibilidade.\n\nResultado: expansão simples, identificação clara dos pontos, manutenção rápida e menos paradas."],
["O que é um datacenter, quais seus sistemas essenciais e como funcionam os Tiers I a IV?","Datacenter é um ambiente projetado para abrigar servidores, armazenamento e equipamentos de rede que sustentam serviços críticos. Sistemas essenciais: energia (nobreaks, geradores), refrigeração, cabeamento e rede, segurança física e prevenção de incêndio.\n\nTier I: sem redundância, cerca de 99,671%, manutenção exige parada. Serve para pequenas empresas.\nTier II: redundância parcial de componentes, cerca de 99,741%.\nTier III: manutenção simultânea sem interrupção, cerca de 99,982%. Serve para empresas médias e grandes.\nTier IV: tolerante a falhas, redundância 2N, cerca de 99,995%. Indicado para bancos e governo."]]},
{t:"Enlace e Redes Sem Fio",s:"MAC, Ethernet, Wi-Fi e 4G/5G",
o:[
["O que é o endereço MAC e qual sua característica?",["Endereço lógico de 32 bits, alterável a qualquer momento pelo administrador","Endereço físico único de 48 bits gravado pelo fabricante na placa de rede, que identifica dispositivos na LAN","Endereço de 128 bits só do IPv6","Protocolo sem fio de longa distância","Identificador de sessão criado pelo TCP"],1],
["O que significa CSMA/CD e onde é usado?",["Carrier Sense Multiple Access / Collision Detection, no Wi-Fi","Common Switching Method and Control / Data, no TCP/IP","Carrier Sense Multiple Access / Collision Detection, no Ethernet, para gerenciar o acesso ao meio e detectar colisões","Control Signal Management Algorithm, em ATM","Channel Switching Multiple Access, exclusivo do 5G"],2],
["Qual padrão opera em 2,4, 5 e 6 GHz e é o Wi-Fi 6?",["802.11a","802.11n","802.11ac","802.11ax","802.11g"],3],
["Principal vantagem do 5 GHz sobre o 2,4 GHz?",["Maior alcance e menos interferência","Maior velocidade, embora com menor alcance e mais sensível a obstáculos","É mais barato e simples de configurar","O 2,4 GHz é mais moderno e melhor em todos os cenários","São equivalentes"],1],
["Em que camada OSI atua o Enlace e quais suas responsabilidades?",["1 (Física): transmissão de bits","3 (Rede): roteamento","2 (Enlace): formação de quadros, controle de acesso ao meio e detecção de erros na comunicação local","4 (Transporte): controle de fluxo e entrega confiável","7 (Aplicação): interface com o usuário"],2]],
d:[
["Explique o CSMA/CD no Ethernet: o que ocorre quando dois dispositivos transmitem ao mesmo tempo?","CSMA/CD (acesso múltiplo com detecção de portadora e de colisão) era usado no Ethernet em meio compartilhado.\n\n1. O dispositivo escuta o meio; se estiver livre, transmite.\n2. Se dois transmitem simultaneamente, os sinais colidem e a variação de tensão é detectada.\n3. Os dois interrompem e enviam um sinal de jam para avisar a todos.\n4. Cada um espera um tempo aleatório (backoff exponencial) e tenta de novo, até um limite de tentativas.\n\nCom switches e full-duplex, colisões deixaram de existir e o CSMA/CD quase não é mais necessário."],
["Compare Wi-Fi (802.11) e redes móveis 4G/5G em velocidade, latência, alcance e casos de uso.","Wi-Fi: alta velocidade em curta distância (dezenas de metros), latência baixa na rede local, banda não licenciada. Ideal para casas, escritórios, escolas e eventos.\n\n4G/5G: usam espectro licenciado das operadoras, cobrem quilômetros e têm mobilidade entre células. O 4G alcança centenas de Mbps; o 5G chega a Gbps e a latências de poucos milissegundos.\n\nUse Wi-Fi em ambientes fechados e fixos. Use 4G/5G em deslocamento, áreas sem infraestrutura, IoT e aplicações críticas como veículos conectados."]]},
{t:"VLAN, LACP e STP",s:"Segmentação, trunk, agregação e Spanning Tree",
o:[
["O que é uma VLAN e qual seu principal benefício?",["Rede física dedicada a um departamento, com cabeamento separado","Segmentação lógica de uma rede física, com ganhos de segurança, organização e redução de broadcast","Protocolo de roteamento dinâmico","Cabo especial entre switches de fabricantes diferentes","Sistema de criptografia do tráfego local"],1],
["Qual a função de uma porta Trunk?",["Conectar um dispositivo final a uma única VLAN, sem tag","Bloquear tráfego entre VLANs","Transportar tráfego de várias VLANs entre switches, usando tags 802.1Q","Aumentar velocidade combinando links físicos","Prevenir loops bloqueando portas redundantes"],2],
["O que é Link Aggregation (LACP, 802.3ad) e seu benefício?",["Protocolo que criptografa tráfego entre switches","Protocolo que segmenta a rede em redes virtuais","Combina vários links físicos em um lógico, aumentando banda, dando redundância e balanceamento de carga","Elege o switch raiz e bloqueia portas redundantes","Protocolo exclusivo de Wi-Fi para agregar APs"],2],
["Qual o objetivo principal do STP?",["Aumentar a banda combinando links","Segmentar a rede em VLANs","Prevenir loops em caminhos redundantes, elegendo um switch raiz e bloqueando portas redundantes","Priorizar tráfego de voz","Criptografar o tráfego entre switches"],2],
["No 802.1Q, o que é a VLAN Nativa?",["A VLAN de maior prioridade, só para voz","A VLAN padrão do trunk que transmite quadros sem tag (untagged), por padrão a VLAN 1","A primeira VLAN criada, que não pode ser excluída","A VLAN de gerenciamento do switch","A VLAN de maior largura de banda"],1]],
d:[
["Explique a VLAN, sua implementação com setores (RH, Financeiro, TI), portas Access e Trunk, o 802.1Q e os benefícios.","VLAN é a divisão lógica de uma rede física em domínios de broadcast separados. Cada setor recebe uma VLAN (ex.: RH 10, Financeiro 20, TI 30), independente de onde estejam fisicamente.\n\nPorta Access: pertence a uma só VLAN e liga o dispositivo final, sem tag. Porta Trunk: liga switches e leva várias VLANs, com o 802.1Q inserindo uma tag com o ID da VLAN em cada quadro.\n\nBenefícios: segurança (o Financeiro fica isolado), menos broadcast e melhor desempenho, gerenciamento mais simples. A comunicação entre VLANs exige roteamento (roteador ou switch L3)."],
["Explique o STP: eleição do switch raiz, bloqueio de portas, importância e versões modernas.","O STP (802.1D) evita loops em redes com caminhos redundantes, que causariam tempestades de broadcast.\n\nOs switches trocam BPDUs e elegem a ponte raiz, a de menor Bridge ID (prioridade + MAC). Cada switch define sua porta raiz (melhor caminho até a raiz), e em cada segmento há uma porta designada. As demais ficam bloqueadas, mantidas como reserva e reativadas se um link falhar.\n\nAssim a rede tem redundância sem loops, com alta disponibilidade.\n\nVersões modernas: RSTP (802.1w), com convergência em segundos, e MSTP (802.1s), que mapeia várias VLANs em instâncias. A Cisco tem o PVST+ e o Rapid PVST+."]]}
];

function obj(q,id,j){const d=document.createElement("div");d.className="q";d.innerHTML="<h3><span>Questão "+(j+1)+"</span>"+q[0]+"</h3>";
const fb=document.createElement("div");fb.className="fb";const bs=[];
const mark=v=>{bs.forEach((b,i)=>{b.disabled=true;if(i==q[2])b.classList.add("ok");else if(i==v)b.classList.add("no")});
fb.style.color=v==q[2]?"var(--ok)":"var(--bad)";fb.textContent=v==q[2]?"Correto!":"Incorreto. A resposta certa é a letra "+L[q[2]]+"."};
q[1].forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML="<b>"+L[i]+"</b><span></span>";b.lastChild.textContent=o;
b.onclick=()=>{S[id]=i;sv();mark(i);stats()};bs.push(b);d.append(b)});
d.append(fb);if(S[id]!==undefined)mark(S[id]);return d}
function dis(q,j){const d=document.createElement("div");d.className="q";d.innerHTML="<h3><span>Questão "+(j+1)+"</span>"+q[0]+"</h3>";
const b=document.createElement("button");b.className="rev";b.textContent="Ver resposta";const a=document.createElement("div");a.className="ans";a.textContent=q[1];
b.onclick=()=>{a.classList.toggle("show");b.textContent=a.classList.contains("show")?"Ocultar resposta":"Ver resposta"};d.append(b,a);return d}
const pt=n=>(n*0.05).toFixed(2).replace(".",",");
function summ(){const c=$("ct");let a=0,h=0,rows="",errs="";
D.forEach((x,i)=>{let ra=0,rh=0;x.o.forEach((q,j)=>{const v=S[i+"-"+j];if(v===undefined)return;ra++;if(v===q[2])rh++;else errs+="<div class='er'><b>Aula "+(i+1)+" · Questão "+(j+1)+"</b><p>"+esc(q[0])+"</p><p class='m'>Você marcou: "+L[v]+") "+esc(q[1][v])+"</p><p class='c'>Correta: "+L[q[2]]+") "+esc(q[1][q[2]])+"</p></div>"});
a+=ra;h+=rh;rows+="<tr><td>Aula "+(i+1)+" – "+x.t+"</td><td>"+ra+"/5</td><td>"+rh+"</td><td>"+(ra-rh)+"</td><td>"+pt(rh)+" de 0,25</td></tr>"});
c.innerHTML="<h2>Resumo geral</h2><p class='sub'>Considera só as 30 questões objetivas (0,05 ponto cada, total de 1,50). As dissertativas valem 1,50 e são corrigidas pelo professor.</p><div class='sm'><div><strong>"+pt(h)+"</strong><span>pontos de 1,50</span></div><div><strong>"+h+"</strong><span>acertos</span></div><div><strong>"+(a-h)+"</strong><span>erros</span></div><div><strong>"+(30-a)+"</strong><span>sem responder</span></div></div><table class='tb'><tr><th>Aula</th><th>Resp.</th><th>Acertos</th><th>Erros</th><th>Pontos</th></tr>"+rows+"</table><h2>O que você errou</h2>"+(errs||"<p class='sub'>"+(a?"Nenhum erro até agora. 🎯":"Você ainda não respondeu nenhuma objetiva.")+"</p>");window.scrollTo({top:0})}
function esc(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML}
$("rv").onclick=()=>{cur=D.length;nav();draw()};
$("rs").onclick=()=>{if(confirm("Apagar suas respostas e recomeçar?")){S={};sv();stats();draw()}};
nav();draw();stats();
</script>
</body>
</html>
